# ==============================================================================
# SonarQube / SonarCloud Scanner Configuration
# ==============================================================================
sonar.projectKey=RN_Boilerplate_Latest
sonar.projectName=RN_Boilerplate_Latest
sonar.sources=src
sonar.tests=__tests__
sonar.test.inclusions=__tests__/**/*.test.ts,__tests__/**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/ios/**,**/android/**,**/coverage/**,**/*.config.js,**/specs/**

# Suppress noisy rule warnings across codebase
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6

# S1192: String literals should not be duplicated (routes, test IDs, action types)
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*

# S3776: Cognitive complexity of functions
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*

# S3358: Nested ternary operators (used in JSX conditional renders)
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S3358
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*

# S125: Commented-out code (used in documentation/sample blocks)
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S125
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*

# S1186: Empty methods/stubs (used in fallback props and mocks)
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S1186
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*

# S9383: Promises should be awaited or marked with void
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S9383
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*
