# Project identification
sonar.projectKey=RN_Boilerplate_Latest
sonar.projectName=RN Boilerplate Latest
sonar.projectVersion=0.0.1

# Source code location
sonar.sources=src
# sonar.tests=__tests__

# Exclude directories
sonar.exclusions=\
  **/node_modules/**,\
  **/android/**,\
  **/ios/**,\
  **/vendor/**,\
  **/coverage/**,\
  **/__mocks__/**,\
  **/build/**,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/assets/**,\
  **/*.config.js,\
  **/*.config.ts,\
  **/*.config.mjs,\
  **/babel.config.js,\
  **/metro.config.js,\
  **/jest.config.js,\
  **/keys.json,\
  **/keys.development.json,\
  **/keys.staging.json,\
  **/keys.production.json

# Language
sonar.language=ts

# Encoding
sonar.sourceEncoding=UTF-8

# TypeScript specific
sonar.typescript.node=node

# Disable coverage reporting
sonar.coverage.exclusions=**
#Code duplication
#sonar.cpd.exclusions=**
sonar.test.exclusions=**

# Disable external issues (issues from dependencies)
sonar.typescript.internal.typescriptLocation=node_modules/typescript

# Host URL (local SonarQube)
sonar.host.url=http://localhost:9000
sonar.skipCoverage=true

# Paste your own Global Analysis Token here. Do not commit a real token.
# sonar.login=your-token-here
