name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keyed by commit. A new push no longer cancels an older run, and re-running
# a failed older commit cannot cancel the current commit's install.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Must run before setup-node: its `cache: yarn` step calls `yarn cache dir`,
      # which must resolve to the yarn version pinned by "packageManager" (3.6.4),
      # not the runner's global yarn 1.x.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Quality gates
        run: bash scripts/ci.sh

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Audit production dependencies
        run: bash scripts/ci.sh audit
