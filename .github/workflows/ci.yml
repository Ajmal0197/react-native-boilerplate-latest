name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Must run before setup-node: its `cache: yarn` step calls `yarn cache dir`,
      # which must resolve to the yarn version pinned by "packageManager" (3.6.4),
      # not the runner's global yarn 1.x.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # Environment key files are git-ignored. Native builds must write real
      # values from the secret store; checks below only need the template.
      - name: Create placeholder key files
        run: |
          for f in keys.json keys.development.json keys.staging.json keys.production.json; do
            cp keys.example.json "$f"
          done

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Unit tests
        run: yarn test --coverage --ci

      - name: Unused code and dependencies
        run: yarn knip:check

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Audit production dependencies
        run: yarn npm audit --environment production
